name: Terraform

on:
  push:
    branches: [main]
    paths: ["**.tf", "**.hcl", ".github/workflows/terraform.yml", ".trivyignore", "infracost.yml"]
  pull_request:
    paths: ["**.tf", "**.hcl", ".github/workflows/terraform.yml", ".trivyignore", "infracost.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write
  id-token: write      # OIDC token for AWS (plan job)
  pull-requests: write # comment the plan on the PR

env:
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.16.5"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive -diff

  validate:
    name: Validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [bootstrap, modules/vpc, modules/eks, environments/dev, environments/prod]
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Init without backend
        run: terraform -chdir=${{ matrix.dir }} init -backend=false -input=false
      - name: Validate
        run: terraform -chdir=${{ matrix.dir }} validate

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0
      - name: Init plugins
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids GitHub API rate limits
      - name: Lint
        run: tflint --recursive --format compact

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy config scan (fails on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore
      - name: Trivy report for the Security tab
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-iac.sarif
          trivyignores: .trivyignore
      - name: Upload SARIF
        if: always() && hashFiles('trivy-iac.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-iac.sarif

  plan:
    name: Plan (${{ matrix.env }})
    # Runs only on pull requests and only after the AWS role is configured
    # (repository variable AWS_PLAN_ROLE_ARN, created by bootstrap/github-oidc.tf)
    if: github.event_name == 'pull_request' && vars.AWS_PLAN_ROLE_ARN != ''
    needs: [validate, tflint, security]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC, no static keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Init
        run: terraform -chdir=environments/${{ matrix.env }} init -input=false

      - name: Plan
        id: plan
        run: |
          set -o pipefail
          terraform -chdir=environments/${{ matrix.env }} plan -input=false -no-color -lock-timeout=5m \
            | tee plan.txt
          echo "summary=$(grep -E '^(Plan:|No changes)' plan.txt | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Comment plan on the pull request
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v9
        env:
          ENV_NAME: ${{ matrix.env }}
          SUMMARY: ${{ steps.plan.outputs.summary }}
          OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = `<!-- terraform-plan-${process.env.ENV_NAME} -->`;
            let plan = fs.existsSync('plan.txt') ? fs.readFileSync('plan.txt', 'utf8') : 'plan output not found';
            if (plan.length > 60000) plan = '...(truncated)\n' + plan.slice(-60000);
            const icon = process.env.OUTCOME === 'success' ? '✅' : '❌';
            const body = `${marker}
            ### ${icon} terraform plan — \`${process.env.ENV_NAME}\`
            **${process.env.SUMMARY || process.env.OUTCOME}**

            <details><summary>Show plan</summary>

            \`\`\`hcl
            ${plan}
            \`\`\`
            </details>`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  cost:
    name: Cost estimate
    # Enabled by repository variable INFRACOST_ENABLED=true and secret INFRACOST_API_KEY (free key)
    if: github.event_name == 'pull_request' && vars.INFRACOST_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Setup Infracost
        uses: infracost/actions/setup@v4
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Checkout base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Cost of the base branch
        run: infracost breakdown --config-file=infracost.yml --format=json --out-file=/tmp/infracost-base.json

      - name: Checkout pull request
        uses: actions/checkout@v7

      - name: Cost difference
        run: |
          infracost diff --config-file=infracost.yml \
            --compare-to=/tmp/infracost-base.json \
            --format=json --out-file=/tmp/infracost.json

      - name: Comment cost on the pull request
        run: |
          infracost comment github --path=/tmp/infracost.json \
            --repo="$GITHUB_REPOSITORY" \
            --github-token="${{ github.token }}" \
            --pull-request="${{ github.event.pull_request.number }}" \
            --behavior=update
